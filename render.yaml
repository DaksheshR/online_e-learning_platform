services:
  - type: web
    name: online-elearning-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:client
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "false"
      - key: MONGO_URI
        sync: false
